services:
  cs-dulceAtardecer:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cs-dulceAtardecer
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - cs-dulceAtardecer_data:/var/opt/mssql

volumes:
  cs-dulceAtardecer_data:
